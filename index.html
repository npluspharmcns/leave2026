<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2026년 잔여 연차 조회</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2f5; --surface:#ffffff; --ink:#16232e; --muted:#5d6d7a; --line:#d5dde3;
  --accent:#0f6b5c; --accent-ink:#ffffff; --soft:#e2f1ee; --warn:#a63a2b;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f171d; --surface:#18232b; --ink:#e8eef2; --muted:#98a8b4; --line:#2b3a45;
    --accent:#3fb8a2; --accent-ink:#06201b; --soft:#1b3a35; --warn:#f08a79;
  }
}
:root[data-theme="dark"]{
  --bg:#0f171d; --surface:#18232b; --ink:#e8eef2; --muted:#98a8b4; --line:#2b3a45;
  --accent:#3fb8a2; --accent-ink:#06201b; --soft:#1b3a35; --warn:#f08a79;
}
html{color-scheme:light dark;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.6;min-height:100vh;display:flex;justify-content:center;padding:32px 16px}
main{width:100%;max-width:440px}
h1{font-size:1.5rem;margin:0 0 4px;font-weight:700;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 24px;font-size:.95rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px}
label{display:block;font-weight:500;font-size:.9rem;margin-bottom:6px}
input{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin-bottom:16px}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:700;width:100%;padding:13px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--line);margin-top:20px}
.err{color:var(--warn);font-size:.9rem;margin:-4px 0 14px;min-height:1.4em}
.hello{font-size:1.1rem;font-weight:700;margin:0 0 2px}
.hire{color:var(--muted);font-size:.9rem;margin:0 0 20px}
.remain{background:var(--soft);border-radius:10px;padding:20px;text-align:center}
.remain small{display:block;color:var(--muted);font-size:.85rem}
.remain strong{font-size:3rem;line-height:1.2;color:var(--accent);font-weight:700}
.remain span{font-size:1.1rem;font-weight:500}
dl{margin:20px 0 0;display:grid;grid-template-columns:1fr auto;gap:10px 12px}
dt{color:var(--muted)} dd{margin:0;font-weight:500;text-align:right}
.bar{height:8px;border-radius:4px;background:var(--line);margin-top:20px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.note{color:var(--muted);font-size:.8rem;margin-top:16px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>2026년 잔여 연차 조회</h1>
  <p class="sub">이름과 생년월일을 입력하면 내 연차 현황을 확인할 수 있어요.</p>

  <section class="panel" id="search">
    <label for="name">이름</label>
    <input id="name" type="text" autocomplete="off" placeholder="홍길동">
    <label for="birth">생년월일</label>
    <input id="birth" type="date" min="1940-01-01" max="2010-12-31">
    <div class="err" id="err" role="alert"></div>
    <button id="go" type="button">조회하기</button>
  </section>

  <section class="panel" id="result" hidden>
    <p class="hello" id="rName"></p>
    <p class="hire" id="rHire"></p>
    <div class="remain"><small>잔여 연차</small><strong id="rRemain"></strong><span>일</span></div>
    <p class="note" id="rAsOf"></p>
    <button class="ghost" id="back" type="button">다시 조회</button>
  </section>
</main>

<script>
/* ▼ 암호화된 직원 데이터 ▼
   이름|생년월일로만 복호화됩니다. 소스에는 평문 정보가 없습니다. */
const ASOF = "2026-11-05";
const EMPLOYEES = [
  "diDREDMelFuKa+bq.pNeUed2qdulBGlI5hnu29vkcpIGIxGC+F/u9Q23qDTLZaHLSG92cZzoFUqd3vOvotbZnY2c1olweQ43NcdvTP8Q3/+WCbYSpD/TjVuVNkf+PODpIS77X576U",
  "PK1CtAR5x+Rf+bUN.dZMz8eKIXK8t1ZCXsA31KikdHRhyFcXQ4L0W0Yo0jNp9CgL8urWsXN6Q/w9LmqDe/TSa1EdCBjaLb9dhHLql1tlLqJ7gz4byir0dFvo1ghmTmlJ5",
  "wYKa8y1wQD8A/1OV.OPXmPIIdtbTGSHD6iUgnP5eOQ54fRJLNpqsQu7z14aHcT0tihHy6rFkuS8ZotYF/dAC7vZJxGApByxENYa/z7AbJDQ3bxaWknSLwFZqGOE3Mbdcj",
  "IxBCv4K9g6fGHabi.uDLMCFkeBj0C/lsPVKlVRGuAzR2FZZKgTF1MkKSmyo/mJQ4vTHkEbQFLaDGcThRvZ2WVrR8SnHYBJrK5GfMi8sUw3ml9Al3NPdv5+dLX68Rz1cmx",
  "lm49ijCqh2ZouUHi.Buz9amSY6SHgM+LZ8bck6SOIap6iE3P+bINwMbCtJZGO/ji+Uzk8SIHJJxyEjHLPvm0Hv5eEkvg5JoA1+5C9CY7nkGi7sBFPxsxUxpQ+TO55UENk",
  "NPdqoXNMcMwK0h22.Owz4CF3k2l8VuAcxXSw2oHwhrAy7LHHwjNeNfto1pU0ajsiH8RACrB1Q0aNhNSRNZCGreBcmKGki7WonDGZ5kC+tLTykAjLdasxhQUiWjLwwVZbziNPq"
];
/* ▲ 여기까지 ▲ */

const $ = id => document.getElementById(id);
const fmtDate = s => { const [y,m,d] = s.split("-"); return `${y}년 ${+m}월 ${+d}일`; };
const fmtNum = n => Number.isInteger(n) ? String(n) : n.toFixed(1);

const unb64 = s => Uint8Array.from(atob(s), ch => ch.charCodeAt(0));
async function decryptMatch(name, birth){
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey("raw", enc.encode(`${name}|${birth}`), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:enc.encode("leave2026-v1"), iterations:200000, hash:"SHA-256"}, km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  for(const rec of EMPLOYEES){
    const [iv, ct] = rec.split(".");
    try{
      const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(iv)}, key, unb64(ct));
      return JSON.parse(new TextDecoder().decode(pt));
    }catch(_){}
  }
  return null;
}
let busy = false;
async function lookup(){
  if(busy) return;
  const name = $("name").value.trim().replace(/\s+/g,"");
  const birth = $("birth").value;
  if(!name || !birth){ $("err").textContent = "이름과 생년월일을 모두 입력해 주세요."; return; }
  if(!(window.crypto && crypto.subtle)){ $("err").textContent = "이 브라우저에서는 조회할 수 없습니다. 최신 브라우저를 사용해 주세요."; return; }
  busy = true; $("go").textContent = "조회 중…";
  let e = null;
  try{ e = await decryptMatch(name, birth); }finally{ busy = false; $("go").textContent = "조회하기"; }
  if(!e){ $("err").textContent = "일치하는 직원 정보가 없습니다. 입력 내용을 확인하거나 인사팀에 문의해 주세요."; return; }
  $("err").textContent = "";
  $("rName").textContent = `${e.title} ${e.name}님`;
  $("rHire").textContent = `입사일 ${fmtDate(e.hire)}`;
  $("rRemain").textContent = fmtNum(e.remain);
  $("rAsOf").textContent = `${fmtDate(ASOF)} 기준 · 내용이 다르면 인사팀에 문의해 주세요.`;
  $("search").hidden = true; $("result").hidden = false;
}
function reset(){
  $("name").value = ""; $("birth").value = "";
  $("result").hidden = true; $("search").hidden = false; $("name").focus();
}
$("go").addEventListener("click", lookup);
$("back").addEventListener("click", reset);
["name","birth"].forEach(id => $(id).addEventListener("keydown", ev => { if(ev.key === "Enter") lookup(); }));
</script>
</body>
</html>
