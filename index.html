<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2026년 잔여 연차 조회</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>2026년 잔여 연차 조회</h1>
  <p class="sub">이름과 생년월일을 입력하면 내 연차 현황을 확인할 수 있어요.</p>
  <section class="panel" id="search">
    <label for="name">이름</label>
    <input id="name" type="text" autocomplete="off" placeholder="홍길동">
    <label for="birth">생년월일</label>
    <input id="birth" type="date" min="1940-01-01" max="2010-12-31">
    <div class="err" id="err" role="alert"></div>
    <button id="go" type="button">조회하기</button>
  </section>
  <section class="panel" id="result" hidden>
    <p class="hello" id="rName"></p>
    <p class="hire" id="rHire"></p>
    <div class="remain"><small>잔여 연차</small><strong id="rRemain"></strong><span>일</span></div>
    <p class="note" id="rAsOf"></p>
    <button class="ghost" id="back" type="button" style="margin-top:20px">다시 조회</button>
  </section>
</main>
<script>
/* ▼ Apps Script 배포 후 받은 웹 앱 URL을 여기에 붙여넣으세요 ▼ */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyM5uhdk7gK-6yGzDp_Sskc4GK8BA92nNjHn2L6aKlhKNVNXHR8qXTiKzcwjv4k14nmsg/exec";

const $ = id => document.getElementById(id);
const fmtDate = s => { const [y,m,d] = s.split("-"); return `${y}년 ${+m}월 ${+d}일`; };
const fmtNum = n => Number.isInteger(n) ? String(n) : n.toFixed(1);
let busy = false;

async function lookup(){
  if(busy) return;
  const name = $("name").value.trim().replace(/\s+/g,""), birth = $("birth").value;
  if(!name || !birth){ $("err").textContent = "이름과 생년월일을 모두 입력해 주세요."; return; }
  if(!SCRIPT_URL.startsWith("https://")){ $("err").textContent = "관리자 설정이 필요합니다. (SCRIPT_URL 미설정)"; return; }
  busy = true; $("go").textContent = "조회 중…"; $("err").textContent = "";
  try{
    const r = await fetch(`${SCRIPT_URL}?name=${encodeURIComponent(name)}&birth=${encodeURIComponent(birth)}`);
    const e = await r.json();
    if(!e.ok){ $("err").textContent = "일치하는 직원 정보가 없습니다. 입력 내용을 확인하거나 인사팀에 문의해 주세요."; return; }
    $("rName").textContent = `${e.name} ${e.title}님`;
    $("rHire").textContent = `입사일 ${e.hire ? fmtDate(e.hire) : "-"}`;
    $("rRemain").textContent = fmtNum(e.remain);
    $("rAsOf").textContent = `${fmtDate(e.asof)} 기준 · 내용이 다르면 인사팀에 문의해 주세요.`;
    $("search").hidden = true; $("result").hidden = false;
  }catch(_){
    $("err").textContent = "조회하지 못했습니다. 잠시 후 다시 시도해 주세요.";
  }finally{ busy = false; $("go").textContent = "조회하기"; }
}
$("go").addEventListener("click", lookup);
$("back").addEventListener("click", () => { $("name").value = ""; $("birth").value = ""; $("result").hidden = true; $("search").hidden = false; $("name").focus(); });
["name","birth"].forEach(id => $(id).addEventListener("keydown", ev => { if(ev.key === "Enter") lookup(); }));
</script>
</body>
</html>
